services:
  - type: web
    name: docuflow-landing-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Envoi d'emails via l'API HTTP Brevo (port 443) — le SMTP sortant est bloqué sur Render free.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: chabidaniel093@gmail.com
      - key: BREVO_SENDER_NAME
        value: DocuFlow AFGC
      - key: MAIL_TO
        value: chabidaniel093@gmail.com
      - key: DATA_DIR
        value: /var/data
    disk:
      name: excel-storage
      mountPath: /var/data
      sizeGB: 1
